<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareMate · 实时监看</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#0c1423;color:#edf2fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 32px}header{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.logo{width:43px;height:43px;border-radius:14px;background:#68dec2;color:#102c29;display:grid;place-items:center;font-size:29px;font-weight:800}
h1{font-size:23px;margin:0;letter-spacing:.3px}header p{margin:4px 0 0;color:#9eafc7;font-size:13px}.spacer{flex:1}
.badge{padding:9px 14px;border:1px solid #38465e;border-radius:30px;font-size:14px;white-space:nowrap;background:#19263a}
button{font:inherit;border:1px solid #40536c;border-radius:10px;padding:10px 15px;color:#edf2fa;background:#1a2c42;cursor:pointer}button:hover{background:#29445f}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}.viewer{position:relative;background:#060c16;border:1px solid #28354b;border-radius:18px;overflow:hidden;min-height:460px;height:calc(100vh - 165px);display:grid;place-items:center}
#video{width:100%;height:100%;object-fit:contain;display:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:40px;background:#0b1421eb;gap:12px}.overlay strong{font-size:26px}.overlay span{font-size:16px;color:#a8b8ce;line-height:1.8}
.video-label{position:absolute;top:17px;left:17px;background:#101e32dc;border:1px solid #3e5069;border-radius:8px;padding:7px 11px;font-size:13px;z-index:1}
.video-foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:16px 20px;background:linear-gradient(transparent,#060c16);font-size:13px;color:#b6c6db}
aside{display:flex;flex-direction:column;gap:16px}.card{border:1px solid #2c3a51;background:#142035;border-radius:16px;padding:22px}.eyebrow{font-size:12px;color:#a9bad1;letter-spacing:1px;margin:0 0 13px}.state{font-size:23px;font-weight:650;line-height:1.5;margin:0 0 12px}.small{font-size:14px;line-height:1.8;color:#a9bad1;margin:0}.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:15px;color:#a9bad1}.row b{color:#edf2fa;font-weight:500}
.accent{color:#69dfc2}.warning{color:#ffd079}.danger{color:#ff9d9d}.event{font-size:12px;color:#91a7c3;overflow-wrap:anywhere;margin-top:14px;line-height:1.7}.flow{margin-top:auto;padding:18px 20px;border-left:2px solid #5bcbb3;font-size:13px;color:#a9bad1;line-height:2}
footer{margin-top:16px;font-size:12px;color:#91a2ba;display:flex;justify-content:space-between;gap:12px}a{color:#9fded2}
@media(max-width:1000px){body{padding:18px}main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}.flow{display:none}.viewer{height:62vh;min-height:300px}header p{display:none}}
@media(max-width:600px){aside{grid-template-columns:1fr}header{flex-wrap:wrap}header .spacer{display:none}footer{display:block}.viewer{height:52vh}}
</style>
<header>
  <div class="logo" aria-hidden="true">+</div><div><h1>CareMate 看护监看</h1><p>iPhone 取景 · 姿态识别 · 床头报警</p></div>
  <div class="spacer"></div><span id="liveStatus" class="badge">等待直播</span><span id="mode" class="badge">正在连接</span><button id="fullscreen" type="button">全屏显示</button>
</header>
<main>
  <section class="viewer" aria-label="摄像头画面">
    <div id="source" class="video-label">等待输入</div>
    <img id="video" alt="摄像头当前画面及人体骨架" draggable="false">
    <div id="overlay" class="overlay"><strong id="overlayTitle">正在连接监看服务</strong><span id="overlayText">画面接通后将在这里显示</span></div>
    <div class="video-foot"><span id="connection">等待更新</span><span id="fps">— 帧/秒</span></div>
  </section>
  <aside>
    <section class="card" aria-live="polite"><p class="eyebrow">当前识别状态</p><p id="state" class="state">等待画面</p><p id="stateHelp" class="small">保持手机固定，让肩部和髋部持续入镜。</p><div class="row"><span>已处理画面</span><b id="frames">0 帧</b></div></section>
    <section class="card" aria-live="polite"><p class="eyebrow">报警通道</p><p id="alarm" class="state">尚无跌倒事件</p><p id="alarmHelp" class="small">是否发送取决于当前运行模式。</p><div class="row"><span>本次规则事件</span><b id="count">0 次</b></div><div id="event" class="event"></div></section>
    <div class="flow">iPhone 提供画面<br>运行视觉程序的设备负责识别<br>床头服务登记警报<br>家属 App 轮询接收并提醒</div>
  </aside>
</main>
<footer><span>仅显示当前画面 · 无暂停和回放功能 · 不保存录像；关闭本页不会停止识别。</span><span>手机是否响铃，需由持有家属 App 的人现场确认。</span></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), video=$('video');
const inputs={waiting:'等待画面',observing:'正在观察',no_person:'未检测到人',pose_unavailable:'身体关键点不完整',input_gap:'画面间隔过长',candidate:'疑似倒地，正在确认',suspected_fall:'疑似跌倒已触发',input_error:'画面已中断'};
const modes={off:'仅观察 · 不发送报警',dry:'无扰测试 · 不建立警报',live:'正式报警 · 自动上报'};
let imageBusy=false,lastFrame=-1,watchdog=0,viewGeneration=0,frameAllowed=false,pollTimer=0,pollGeneration=0,isCamera=false;
function cover(title,detail){viewGeneration++;frameAllowed=false;video.style.display='none';$('liveStatus').textContent='等待新画面';$('liveStatus').className='badge';$('overlay').style.display='grid';$('overlayTitle').textContent=title;$('overlayText').textContent=detail;}
function offline(){clearTimeout(watchdog);cover('监看连接已断开','请检查监看地址、网络和视觉服务；本页无法判断后台是否仍在识别。');$('connection').textContent='监看连接中断';$('state').textContent='状态未知';$('fps').textContent='— 帧/秒';}
async function fetchTimed(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2200);try{return await fetch(path,{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timer);}}
async function updateImage(sequence){
  if(imageBusy||sequence===lastFrame)return;
  imageBusy=true;
  const generation=viewGeneration;
  let objectUrl;
  try{const response=await fetchTimed('/frame.jpg?seq='+sequence);if(!response.ok)throw Error('frame');const data=await response.blob();if(generation!==viewGeneration||!frameAllowed||document.hidden)return;objectUrl=URL.createObjectURL(data);
    await new Promise((resolve,reject)=>{video.onload=resolve;video.onerror=reject;video.src=objectUrl;});
    if(frameAllowed&&generation===viewGeneration&&!document.hidden){lastFrame=sequence;video.style.display='block';$('overlay').style.display='none';$('liveStatus').textContent=isCamera?'● 实时直播':'离线测试';$('liveStatus').className='badge '+(isCamera?'accent':'warning');}
  }catch(_){if(generation===viewGeneration)cover('暂时没有新画面','请检查手机摄像头 App 是否仍在前台，等待画面恢复。');}
  finally{if(objectUrl)URL.revokeObjectURL(objectUrl);imageBusy=false;}
}
function display(s){
  clearTimeout(watchdog);watchdog=setTimeout(offline,3500);
  $('mode').textContent=modes[s.mode]||'运行模式未知';$('mode').className='badge '+(s.mode==='live'?'warning':'');
  const isPhone=s.input_kind==='phone_mjpeg';$('source').textContent=isPhone?'iPhone 摄像头 + 姿态骨架':s.input_kind==='pc_camera'?'电脑摄像头 + 姿态骨架':'离线演示 · 非实时摄像头';
  isCamera=isPhone||s.input_kind==='pc_camera';
  $('frames').textContent=s.sequence+' 帧';$('fps').textContent=s.processing_fps+' 帧/秒';$('count').textContent=s.alarm_count+' 次';
  $('state').textContent=inputs[s.input_state]||'等待画面';$('state').className='state '+(s.input_state==='suspected_fall'?'danger':s.input_state==='candidate'?'warning':'accent');
  $('stateHelp').textContent=s.stale?'当前没有持续更新的识别结果。':s.input_state==='no_person'||s.input_state==='pose_unavailable'?'调整取景，让肩部和髋部清楚入镜。':s.input_state==='candidate'?'仍在规则确认阶段，尚未因此建立新警报。':'保持手机固定，让肩部和髋部持续入镜。';
  const event=s.latest_alarm,states={queued:['正在发送','已记录事件号，等待床头回执。'],disabled:['仅本地记录','当前仅观察，未向床头发送。'],dry_accepted:['无扰检查通过','床头核对成功，本次没有建立警报。'],bedside_accepted:['床头已登记警报','家属手机是否收到，仍待现场确认。'],failed:['发送未确认','请保留原事件号排查连接，送达情况未知。']};
  const description=event?(states[event.status]||['等待回执','正在处理本次事件。']):['尚无跌倒事件',s.mode==='live'?'规则确认跌倒后将自动上报。':s.mode==='dry'?'无扰模式只检查格式，不建立警报。':'当前仅观察，不会发送报警。'];
  $('alarm').textContent=description[0];$('alarmHelp').textContent=description[1];$('alarm').className='state '+(event&&event.status==='failed'?'danger':'');$('event').textContent=event?'事件号 '+event.event_id+(event.alarm_id?'\n报警号 '+event.alarm_id:''):'';
  if(s.run_status==='error'){cover('摄像头连接失败',s.input_message||'视觉程序已停止。请查看电脑上的启动窗口，根据提示修正后重试。');$('state').textContent='识别已停止';$('state').className='state danger';$('stateHelp').textContent='请回到电脑上的启动窗口重新输入；网页不会显示旧画面。';$('connection').textContent='未接通直播 · 等待在启动窗口重试';}
  else if(s.stale){cover(s.sequence?'画面已中断':'等待第一份识别画面','请检查摄像头输入及视觉服务；停止画面不代表安全。');$('connection').textContent='没有新识别画面';}
  else if(s.render_error){cover('画面显示异常','姿态识别可能仍在运行，请让队友查看视觉服务日志。');$('connection').textContent='监看编码异常';}
  else if(s.frame_ready){frameAllowed=true;$('connection').textContent='监看已连接 · '+s.frame_age_s+' 秒前更新';updateImage(s.jpeg_sequence);}
  else{cover('正在准备监看画面','姿态处理已启动，等待画面编码。');$('connection').textContent='等待画面显示';}
}
async function poll(){const generation=pollGeneration;try{const response=await fetchTimed('/api/status');if(!response.ok)throw Error('status');const status=await response.json();if(generation===pollGeneration&&!document.hidden)display(status);}catch(_){if(generation===pollGeneration&&!document.hidden)offline();}finally{if(generation===pollGeneration&&!document.hidden)pollTimer=setTimeout(poll,400);}}
function reconnect(){pollGeneration++;clearTimeout(pollTimer);clearTimeout(watchdog);lastFrame=-1;cover('正在连接当前画面','直播只显示新画面，不补播离开期间的内容。');if(!document.hidden)poll();}
video.addEventListener('contextmenu',event=>event.preventDefault());
document.addEventListener('visibilitychange',reconnect);
window.addEventListener('pagehide',()=>{pollGeneration++;clearTimeout(pollTimer);clearTimeout(watchdog);cover('等待重新连接','返回页面后将直接显示当前画面。');});
window.addEventListener('pageshow',event=>{if(event.persisted)reconnect();});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){$('fullscreen').textContent='请按 F11 全屏';}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏显示';});
poll();
</script>
</html>
